<!DOCTYPE html>
<html lang="de">
  <head>
    {#include partials/head /}
  </head>
  <body>
    <header class="site-header">
      <img src="/four-crown-classic/images/four-crown-classic.png" alt="Four Crown Classic" class="logo" />
    </header>

    <nav class="main-nav" aria-label="Hauptmenü">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen" />
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
        <span class="nav-toggle-label-current" aria-live="polite"></span>
      </label>

      <div class="nav-panel">
        {#include partials/roq-default/sidebar-menu menu=cdi:menu.items menuTitle='Menü' /}
      </div>
    </nav>

    {#insert /}

    <footer class="site-footer">
      <a href="/four-crown-classic/impressum/">Impressum</a>
      <a href="/four-crown-classic/datenschutz/">Datenschutzerklärung</a>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var labelCurrent = document.querySelector('.nav-toggle-label-current');
        if (!labelCurrent) return;

        var activeLink = document.querySelector('.menu a.active, .site-menu a.active');
        if (!activeLink) {
          labelCurrent.textContent = '';
          return;
        }

        var text = activeLink.textContent.trim();
        if (text) {
          labelCurrent.textContent = text;
        }
      });
    </script>
  </body>
</html>
